spring.application.name=PruebaPDFBox
# ==============================
# DATABASE (PostgreSQL)
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/Zonamedica
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# SERVER
# ==============================
server.port=8080

# ==============================
# PDF
# ==============================
# Carpeta donde se guardaran los PDFs
pdf.folder=pdfs

# ==============================
# SPRING SECURITY (DEACTIVATE)
# ==============================
spring.security.enabled=false

# ==============================
# SIZE FILE
# ==============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

jwt.secret=FPLN19U60lSR1c1SsCM0nvuxg0drbaTJ6VTn1FmlC4C
jwt.expiration=10800000