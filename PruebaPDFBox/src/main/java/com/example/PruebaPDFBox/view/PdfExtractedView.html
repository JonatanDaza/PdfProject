<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historias Clínicas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .search-box {
            flex: 1;
            max-width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-info {
            color: #667eea;
            font-weight: 600;
            min-width: 120px;
            text-align: center;
        }

        /* Historia Clínica Card */
        .hc-container {
            padding: 20px;
        }

        .clinical-history-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            overflow: hidden;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hc-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hc-title {
            font-size: 1.5em;
            font-weight: 600;
        }

        .hc-id {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .hc-body {
            padding: 30px;
        }

        .exam-section {
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
            padding-left: 20px;
        }

        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .exam-name {
            font-size: 1.3em;
            color: #667eea;
            font-weight: 600;
        }

        .exam-date {
            color: #999;
            font-size: 0.9em;
        }

        .worker-info {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .worker-info h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .info-value {
            color: #333;
            font-size: 1em;
            word-wrap: break-word;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .no-data {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal-close:hover {
            color: #667eea;
        }

        .text-modal {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .text-modal h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📋 Historias Clínicas</h1>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Buscar por CC o nombre...">
        </div>

        <div class="pagination">
            <button class="btn" id="prevBtn" onclick="previousPage()">⬅️ Anterior</button>
            <span class="page-info" id="pageInfo">Página 1</span>
            <button class="btn" id="nextBtn" onclick="nextPage()">Siguiente ➡️</button>
        </div>

        <button class="btn" onclick="loadClinicalHistories()">🔄 Recargar</button>
    </div>

    <div id="loadingDiv" class="loading">
        <div class="spinner"></div>
        <div>Cargando historias clínicas...</div>
    </div>

    <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-state-icon">📭</div>
        <h2>No hay historias clínicas</h2>
        <p>Las historias clínicas procesadas aparecerán aquí</p>
    </div>

    <div id="hcContainer" class="hc-container" style="display: none;">
        <!-- Las historias clínicas se cargarán aquí -->
    </div>
</div>

<!-- Modal para texto completo -->
<div class="modal" id="textModal">
    <span class="modal-close" onclick="closeModal('textModal')">&times;</span>
    <div class="text-modal">
        <h2 id="modalTitle">Información Detallada</h2>
        <div class="text-full" id="modalText"></div>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8080';
    let currentPage = 0;
    let totalPages = 0;
    let pageSize = 1; // 1 historia clínica por página

    // Cargar historias clínicas al iniciar
    window.addEventListener('DOMContentLoaded', loadClinicalHistories);

    async function loadClinicalHistories() {
        const loadingDiv = document.getElementById('loadingDiv');
        const emptyState = document.getElementById('emptyState');
        const hcContainer = document.getElementById('hcContainer');

        loadingDiv.style.display = 'block';
        emptyState.style.display = 'none';
        hcContainer.style.display = 'none';

        try {
            const response = await fetch(`${API_BASE_URL}/pdf/HC`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    page: currentPage,
                    size: pageSize
                })
            });

            if (!response.ok) {
                throw new Error('Error al cargar las historias clínicas');
            }

            const data = await response.json();
            totalPages = data.totalPages;

            loadingDiv.style.display = 'none';

            if (data.data.length === 0) {
                emptyState.style.display = 'block';
            } else {
                hcContainer.style.display = 'block';
                renderClinicalHistories(data.data);
                updatePagination();
            }

        } catch (error) {
            console.error('Error:', error);
            loadingDiv.innerHTML = `
                <div style="color: #ff4757;">
                    ❌ Error al cargar las historias clínicas<br>
                    <small>${error.message}</small>
                </div>
            `;
        }
    }

    function renderClinicalHistories(histories) {
        const container = document.getElementById('hcContainer');
        container.innerHTML = '';

        console.log('Historias clínicas recibidas:', histories);

        histories.forEach(hc => {
            console.log('Historia clínica:', hc);
            const card = createClinicalHistoryCard(hc);
            container.appendChild(card);
        });
    }

    function createClinicalHistoryCard(hc) {
        const card = document.createElement('div');
        card.className = 'clinical-history-card';

        // Header
        const header = document.createElement('div');
        header.className = 'hc-header';
        header.innerHTML = `
            <div>
                <div class="hc-title">📋 Historia Clínica</div>
                <div class="hc-id">ID: HC-${String(hc.id).padStart(6, '0')}</div>
            </div>
            <a href="EditHCView.html?id=${hc.id}" class="btn" style="text-decoration: none;">✏️ Editar</a>
        `;
        card.appendChild(header);

        // Body
        const body = document.createElement('div');
        body.className = 'hc-body';

        if (!hc.exams || hc.exams.length === 0) {
            body.innerHTML = '<div class="no-data">No hay exámenes registrados</div>';
        } else {
            hc.exams.forEach(exam => {
                const examSection = createExamSection(exam);
                body.appendChild(examSection);
            });
        }

        card.appendChild(body);
        return card;
    }

    function createExamSection(exam) {
        const section = document.createElement('div');
        section.className = 'exam-section';

        console.log('Examen:', exam);
        console.log('Worker:', exam.worker);
        console.log('DataExam:', exam.dataExam);

        // Exam Header
        const examHeader = document.createElement('div');
        examHeader.className = 'exam-header';
        examHeader.innerHTML = `
            <div class="exam-name">🏥 ${exam.examName || 'Examen sin nombre'}</div>
            <div class="exam-date">📅 ${exam.examDate || 'Sin fecha'}</div>
        `;
        section.appendChild(examHeader);

        // Worker Information
        if (exam.worker) {
            const workerInfo = createWorkerInfo(exam.worker);
            section.appendChild(workerInfo);
        }

        // Exam Data
        if (exam.dataExam) {
            const dataInfo = createDataExamInfo(exam.dataExam);
            section.appendChild(dataInfo);
        }

        return section;
    }

    function createWorkerInfo(worker) {
        const workerDiv = document.createElement('div');
        workerDiv.className = 'worker-info';

        const fields = [
            { label: 'Cédula', value: worker.cc || worker.CC },
            { label: 'Género', value: worker.gender || worker.Gender },
            { label: 'Edad', value: worker.age || worker.Age },
            { label: 'Estado Civil', value: worker.maritalStatus || worker.MaritalStatus },
            { label: 'Nivel Educativo', value: worker.educationalLevel || worker.EducationalLevel }
        ];

        let html = '<h3>👤 Información del Trabajador</h3><div class="info-grid">';
        let hasData = false;
        fields.forEach(field => {
            if (field.value) {
                hasData = true;
                html += `
                    <div class="info-item">
                        <span class="info-label">${field.label}</span>
                        <span class="info-value">${field.value}</span>
                    </div>
                `;
            }
        });
        html += '</div>';

        if (!hasData) {
            html = '<h3>👤 Información del Trabajador</h3><div class="no-data">No hay datos del trabajador</div>';
        }

        workerDiv.innerHTML = html;
        return workerDiv;
    }

    function createDataExamInfo(dataExam) {
        const dataDiv = document.createElement('div');
        dataDiv.className = 'worker-info';

        const fields = [
            { label: 'Años de Exposición', value: dataExam.year || dataExam.Year },
            { label: 'Accidente de Trabajo', value: dataExam.workAccident || dataExam.WorkAccident },
            { label: 'Enfermedades Ocupacionales', value: dataExam.occupationalDiseases || dataExam.OccupationalDiseases },
            { label: 'Actividades Manuales', value: dataExam.manualActivities || dataExam.ManualActivities },
            { label: 'Actividad Física', value: dataExam.physicalActivity || dataExam.PhysicalActivity },
            { label: 'Hábitos de Tabaquismo', value: dataExam.smokingHabits || dataExam.SmokingHabits },
            { label: 'Hábitos de Alcohol', value: dataExam.alcoholHabits || dataExam.AlcoholHabits },
            { label: 'Presión Arterial', value: dataExam.bloodPressure || dataExam.BloodPressure },
            { label: 'Frecuencia Cardíaca', value: dataExam.heartRate || dataExam.HeartRate },
            { label: 'Frecuencia Respiratoria', value: dataExam.respiratoryRate || dataExam.RespiratoryRate },
            { label: 'Lateralidad Dominante', value: dataExam.dominantLaterality || dataExam.DominantLaterality },
            { label: 'Perímetro Abdominal', value: dataExam.abdominalPerimeter || dataExam.AbdominalPerimeter },
            { label: 'Peso', value: dataExam.weight || dataExam.Weight },
            { label: 'Talla', value: dataExam.size || dataExam.Size },
            { label: 'IMC', value: dataExam.imc || dataExam.IMC },
            { label: 'Oído Derecho', value: dataExam.rightEar || dataExam.RightEar },
            { label: 'Oído Izquierdo', value: dataExam.leftEar || dataExam.LeftEar },
            { label: 'Código de Examen', value: dataExam.examCode || dataExam.ExamCode }
        ];

        let html = '<h3>📊 Datos del Examen</h3><div class="data-grid">';
        let hasData = false;

        fields.forEach(field => {
            if (field.value && field.value.trim() !== '') {
                hasData = true;
                html += `
                    <div class="info-item">
                        <span class="info-label">${field.label}</span>
                        <span class="info-value">${field.value}</span>
                    </div>
                `;
            }
        });
        html += '</div>';

        // Campos de texto largo
        const diagnostics = dataExam.diagnostics || dataExam.Diagnostics;
        if (diagnostics && diagnostics.trim() !== '') {
            hasData = true;
            html += `
                <div class="info-item" style="margin-top: 15px;">
                    <span class="info-label">🩺 Diagnósticos</span>
                    <span class="info-value" style="white-space: pre-wrap;">${diagnostics}</span>
                </div>
            `;
        }

        const occupationalConcept = dataExam.occupationalConcept || dataExam.OccupationalConcept;
        if (occupationalConcept && occupationalConcept.trim() !== '') {
            hasData = true;
            html += `
                <div class="info-item" style="margin-top: 15px;">
                    <span class="info-label">💼 Concepto Ocupacional</span>
                    <span class="info-value" style="white-space: pre-wrap;">${occupationalConcept}</span>
                </div>
            `;
        }

        if (!hasData) {
            html = '<h3>📊 Datos del Examen</h3><div class="no-data">No hay datos del examen</div>';
        }

        dataDiv.innerHTML = html;
        return dataDiv;
    }

    function updatePagination() {
        document.getElementById('pageInfo').textContent = `Página ${currentPage + 1} de ${totalPages || 1}`;
        document.getElementById('prevBtn').disabled = currentPage === 0;
        document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1 || totalPages === 0;
    }

    function previousPage() {
        if (currentPage > 0) {
            currentPage--;
            loadClinicalHistories();
        }
    }

    function nextPage() {
        if (currentPage < totalPages - 1) {
            currentPage++;
            loadClinicalHistories();
        }
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('show');
    }

    // Cerrar modal al hacer clic fuera
    window.onclick = function(event) {
        const textModal = document.getElementById('textModal');
        if (event.target === textModal) {
            closeModal('textModal');
        }
    }
</script>
</body>
</html>
