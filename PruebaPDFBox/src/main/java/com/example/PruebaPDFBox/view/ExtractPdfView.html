<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extraer PDF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 0.9em;
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            background: #f0f2ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .file-info.show {
            display: flex;
        }

        .file-icon {
            font-size: 2em;
        }

        .file-details {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
        }

        .file-size {
            font-size: 0.85em;
            color: #666;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .result-section {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .result-title {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .text-content {
            background: white;
            padding: 15px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.6;
            color: #333;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .image-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .image-item img {
            max-width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .image-item img:hover {
            transform: scale(1.05);
        }

        .image-name {
            font-size: 0.8em;
            color: #666;
            word-break: break-all;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        /* Modal para vista previa */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal-close:hover {
            color: #667eea;
        }

        .pdf-preview {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .pdf-preview.show {
            display: block;
        }

        .pdf-preview-title {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .pdf-viewer {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f5;
        }

        .pdf-viewer embed {
            width: 100%;
            height: 600px;
            border: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📄 Extractor de PDF</h1>
    <a href="PdfExtractedView.html">PDF Extraidos</a>
        <p class="subtitle">Sube un archivo PDF para extraer su texto e imágenes</p>

    <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📁</div>
        <div class="upload-text">Haz clic o arrastra un archivo PDF aquí</div>
        <div class="upload-hint">Tamaño máximo: 10MB</div>
        <input type="file" id="fileInput" accept=".pdf">
    </div>

    <div class="file-info" id="fileInfo">
        <div class="file-icon">📄</div>
        <div class="file-details">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>
    </div>

    <button class="btn" id="processBtn" disabled>Procesar PDF</button>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Procesando PDF...</div>
    </div>

    <div class="error" id="error"></div>

    <div class="results" id="results">
        <div class="result-section">
            <div class="result-title">📝 Texto Extraído</div>
            <div class="text-content" id="textContent"></div>
        </div>

        <div class="result-section">
            <div class="result-title">🖼️ Imágenes Extraídas (<span id="imageCount">0</span>)</div>
            <div class="images-grid" id="imagesGrid"></div>
        </div>
    </div>
</div>

<!-- Modal para vista previa de imágenes -->
<div class="modal" id="imageModal" onclick="closeImageModal()">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modalImage">
</div>

<script>
    // Configura aquí el puerto de tu API Spring Boot
    const API_BASE_URL = 'http://localhost:8080';

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const processBtn = document.getElementById('processBtn');
    const loading = document.getElementById('loading');
    const results = document.getElementById('results');
    const textContent = document.getElementById('textContent');
    const imagesGrid = document.getElementById('imagesGrid');
    const imageCount = document.getElementById('imageCount');
    const errorDiv = document.getElementById('error');
    const imageModal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');

    let selectedFile = null;

    // Click en el área de carga
    uploadArea.addEventListener('click', () => fileInput.click());

    // Selección de archivo
    fileInput.addEventListener('change', (e) => {
        handleFile(e.target.files[0]);
    });

    // Drag and drop
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
        if (!file) return;

        if (file.type !== 'application/pdf') {
            showError('Por favor selecciona un archivo PDF válido');
            return;
        }

        if (file.size > 50 * 1024 * 1024) {
            showError('El archivo es demasiado grande. Máximo 10MB');
            return;
        }

        selectedFile = file;
        fileName.textContent = file.name;
        fileSize.textContent = formatFileSize(file.size);
        fileInfo.classList.add('show');
        processBtn.disabled = false;
        errorDiv.classList.remove('show');
        results.classList.remove('show');
    }

    processBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        const formData = new FormData();
        formData.append('file', selectedFile);

        processBtn.disabled = true;
        loading.classList.add('show');
        results.classList.remove('show');
        errorDiv.classList.remove('show');

        try {
            // Primero subir el archivo
            const uploadResponse = await fetch(`${API_BASE_URL}/pdf/upload`, {
                method: 'POST',
                body: formData
            });

            if (!uploadResponse.ok) {
                throw new Error('Error al subir el archivo');
            }

            const uploadData = await uploadResponse.text();
            console.log('Archivo subido:', uploadData);

            // Luego extraer contenido
            const extractResponse = await fetch(`${API_BASE_URL}/pdf/extract`, {
            method: 'POST',
            body: formData
            });


            if (!extractResponse.ok) {
                throw new Error('Error al procesar el PDF');
            }

            const data = await extractResponse.json();
            displayResults(data);

        } catch (error) {
            showError('Error: ' + error.message);
        } finally {
            loading.classList.remove('show');
            processBtn.disabled = false;
        }
    });

    function displayResults(data) {
        textContent.textContent = data.body || 'No se encontró texto en el PDF';
        results.classList.add('show');
    }

    function showError(message) {
        errorDiv.textContent = message;
        errorDiv.classList.add('show');
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    // Funciones para el modal de imágenes
    function openImageModal(imageSrc) {
        modalImage.src = imageSrc;
        imageModal.classList.add('show');
    }

    function closeImageModal() {
        imageModal.classList.remove('show');
    }

    // Cerrar modal con tecla ESC
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeImageModal();
        }
    });
</script>
</body>
</html>
