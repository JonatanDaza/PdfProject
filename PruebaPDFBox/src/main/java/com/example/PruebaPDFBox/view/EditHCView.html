<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Historia Clínica</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2em;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .btn-cancel {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
        }

        .form-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            font-size: 1.3em;
            font-weight: 600;
        }

        .form-body {
            padding: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea.form-input {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            border: 4px solid rgba(102, 126, 234, 0.3);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .exam-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .exam-tab {
            padding: 12px 24px;
            background: #f0f2ff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .exam-tab:hover {
            background: #e8ebff;
        }

        .exam-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .exam-content {
            display: none;
        }

        .exam-content.active {
            display: block;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>✏️ Editar Historia Clínica</h1>
        <a href="PdfExtractedView.html" class="btn btn-cancel">Volver</a>
    </div>

    <div id="loadingDiv" class="loading" style="display: none;">
        <div class="spinner"></div>
        <div style="color: white; font-size: 1.2em;">Cargando datos...</div>
    </div>

    <div id="alertDiv" style="display: none;"></div>

    <div id="formContainer" style="display: none;">
        <div class="form-card">
            <div class="form-header">
                📋 Historia Clínica ID: <span id="hcId"></span>
                <span style="margin-left: 20px; font-size: 0.9em;">
                    📑 <span id="examCount"></span> examen(es)
                </span>
            </div>
        </div>

        <div class="form-card">
            <div class="form-body">
                <div class="exam-tabs" id="examTabs"></div>
                <div id="examFormsContainer"></div>

                <div class="button-group">
                    <button class="btn btn-cancel" onclick="cancelEdit()">Cancelar</button>
                    <button class="btn btn-success" onclick="saveChanges()">💾 Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8080';
    let clinicalHistoryData = null;

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const hcId = urlParams.get('id');

        if (!hcId) {
            showAlert('No se especificó una historia clínica', 'error');
            return;
        }

        loadClinicalHistory(hcId);
    });

    async function loadClinicalHistory(hcId) {
        const loadingDiv = document.getElementById('loadingDiv');
        const formContainer = document.getElementById('formContainer');

        loadingDiv.style.display = 'block';

        try {
            const response = await fetch(`${API_BASE_URL}/pdf/HC`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    page: 0,
                    size: 100
                })
            });

            if (!response.ok) throw new Error('Error al cargar la historia clínica');

            const data = await response.json();
            console.log('Datos completos recibidos:', data);

            const hc = data.data.find(h => h.id == hcId);

            if (!hc) throw new Error('Historia clínica no encontrada');

            console.log('Historia clínica encontrada:', hc);
            console.log('Número de exámenes:', hc.exams?.length);

            // Log de cada examen para ver su estructura
            if (hc.exams) {
                hc.exams.forEach((exam, index) => {
                    console.log(`--- Examen ${index + 1} ---`);
                    console.log('ID:', exam.id);
                    console.log('Nombre:', exam.examName);
                    console.log('Fecha:', exam.examDate);
                    console.log('Worker completo:', exam.worker);
                    console.log('DataExam completo:', exam.dataExam);
                });
            }

            clinicalHistoryData = hc;
            renderForm();

            loadingDiv.style.display = 'none';
            formContainer.style.display = 'block';

        } catch (error) {
            console.error('Error:', error);
            loadingDiv.style.display = 'none';
            showAlert('Error: ' + error.message, 'error');
        }
    }

    function renderForm() {
        document.getElementById('hcId').textContent = String(clinicalHistoryData.id).padStart(6, '0');
        document.getElementById('examCount').textContent = clinicalHistoryData.exams?.length || 0;

        const examTabs = document.getElementById('examTabs');
        const examFormsContainer = document.getElementById('examFormsContainer');

        examTabs.innerHTML = '';
        examFormsContainer.innerHTML = '';

        if (!clinicalHistoryData.exams || clinicalHistoryData.exams.length === 0) {
            examFormsContainer.innerHTML = '<div style="text-align: center; color: #999;">No hay exámenes</div>';
            return;
        }

        console.log('Renderizando formularios para', clinicalHistoryData.exams.length, 'exámenes');

        clinicalHistoryData.exams.forEach((exam, index) => {
            console.log(`Creando pestaña para examen ${index + 1}:`, exam.examName);

            // Crear pestaña
            const tab = document.createElement('div');
            tab.className = 'exam-tab' + (index === 0 ? ' active' : '');
            tab.textContent = `${exam.examName || `Examen ${index + 1}`} (ID: ${exam.id})`;
            tab.onclick = () => switchExam(index);
            examTabs.appendChild(tab);

            // Crear formulario
            const formDiv = document.createElement('div');
            formDiv.className = 'exam-content' + (index === 0 ? ' active' : '');
            formDiv.id = `exam-form-${index}`;
            formDiv.innerHTML = createExamForm(exam, index);
            examFormsContainer.appendChild(formDiv);
        });

        console.log('Formularios creados exitosamente');
    }

    function createExamForm(exam, index) {
        console.log(`Creando formulario para examen ${index}:`, exam);

        const worker = exam.worker || {};
        const dataExam = exam.dataExam || {};

        console.log(`Worker del examen ${index}:`, worker);
        console.log(`DataExam del examen ${index}:`, dataExam);

        // Función auxiliar para obtener valor con fallback
        const getValue = (obj, key1, key2) => {
            return obj[key1] || obj[key2] || '';
        };

        // Función para verificar si un campo tiene valor
        const hasValue = (obj, key1, key2) => {
            const val = getValue(obj, key1, key2);
            return val && val.toString().trim() !== '';
        };

        // Definir todos los campos posibles de DataExam
        const dataExamFields = [
            { id: 'Year', label: 'Años de Exposición', keys: ['year', 'Year'], placeholder: 'Años' },
            { id: 'WorkAccident', label: 'Accidente de Trabajo', keys: ['workAccident', 'WorkAccident'], placeholder: 'Sí/No' },
            { id: 'OccupationalDiseases', label: 'Enfermedades Ocupacionales', keys: ['occupationalDiseases', 'OccupationalDiseases'], placeholder: 'Enfermedades' },
            { id: 'ManualActivities', label: 'Actividades Manuales', keys: ['manualActivities', 'ManualActivities'], placeholder: 'Actividades', textarea: true },
            { id: 'PhysicalActivity', label: 'Actividad Física', keys: ['physicalActivity', 'PhysicalActivity'], placeholder: 'Actividad física' },
            { id: 'SmokingHabits', label: 'Hábitos de Tabaquismo', keys: ['smokingHabits', 'SmokingHabits'], placeholder: 'Sí/No' },
            { id: 'AlcoholHabits', label: 'Hábitos de Alcohol', keys: ['alcoholHabits', 'AlcoholHabits'], placeholder: 'Sí/No' },
            { id: 'BloodPressure', label: 'Presión Arterial', keys: ['bloodPressure', 'BloodPressure'], placeholder: '120/80' },
            { id: 'HeartRate', label: 'Frecuencia Cardíaca', keys: ['heartRate', 'HeartRate'], placeholder: 'BPM' },
            { id: 'RespiratoryRate', label: 'Frecuencia Respiratoria', keys: ['respiratoryRate', 'RespiratoryRate'], placeholder: 'RPM' },
            { id: 'DominantLaterality', label: 'Lateralidad Dominante', keys: ['dominantLaterality', 'DominantLaterality'], placeholder: 'Derecha/Izquierda' },
            { id: 'AbdominalPerimeter', label: 'Perímetro Abdominal', keys: ['abdominalPerimeter', 'AbdominalPerimeter'], placeholder: 'cm' },
            { id: 'Weight', label: 'Peso', keys: ['weight', 'Weight'], placeholder: 'Kg' },
            { id: 'Size', label: 'Talla', keys: ['size', 'Size'], placeholder: 'cm' },
            { id: 'IMC', label: 'IMC', keys: ['imc', 'IMC'], placeholder: 'IMC' },
            { id: 'RightEar', label: 'Oído Derecho', keys: ['rightEar', 'RightEar'], placeholder: 'Resultados' },
            { id: 'LeftEar', label: 'Oído Izquierdo', keys: ['leftEar', 'LeftEar'], placeholder: 'Resultados' },
            { id: 'Diagnostics', label: 'Diagnósticos', keys: ['diagnostics', 'Diagnostics'], placeholder: 'Diagnósticos...', textarea: true },
            { id: 'OccupationalConcept', label: 'Concepto Ocupacional', keys: ['occupationalConcept', 'OccupationalConcept'], placeholder: 'Concepto...', textarea: true },
            { id: 'ExamCode', label: 'Código de Examen', keys: ['examCode', 'ExamCode'], placeholder: 'Código' }
        ];

        // Filtrar solo los campos que tienen datos
        const fieldsWithData = dataExamFields.filter(field =>
            hasValue(dataExam, field.keys[0], field.keys[1])
        );

        console.log(`Campos con datos para examen ${index}:`, fieldsWithData.map(f => f.label));

        let html = `
            <!-- Datos del Examen -->
            <div class="form-card" style="margin-bottom: 20px;">
                <div class="form-header">🏥 ${exam.examName || 'Examen'}</div>
                <div class="form-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Nombre del Examen</label>
                            <input type="text" class="form-input" id="examName-${index}"
                                   value="${exam.examName || ''}" />
                        </div>
                        <div class="form-group">
                            <label class="form-label">Fecha</label>
                            <input type="text" class="form-input" id="examDate-${index}"
                                   value="${exam.examDate || ''}" />
                        </div>
                    </div>
                </div>
            </div>

            <!-- Información del Trabajador -->
            <div class="form-card" style="margin-bottom: 20px;">
                <div class="form-header">👤 Información del Trabajador</div>
                <div class="form-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Cédula</label>
                            <input type="text" class="form-input" id="workerCC-${index}"
                                   value="${getValue(worker, 'cc', 'CC')}" />
                        </div>
                        <div class="form-group">
                            <label class="form-label">Género</label>
                            <input type="text" class="form-input" id="workerGender-${index}"
                                   value="${getValue(worker, 'gender', 'Gender')}" />
                        </div>
                        <div class="form-group">
                            <label class="form-label">Edad</label>
                            <input type="text" class="form-input" id="workerAge-${index}"
                                   value="${getValue(worker, 'age', 'Age')}" />
                        </div>
                        <div class="form-group">
                            <label class="form-label">Estado Civil</label>
                            <input type="text" class="form-input" id="workerMaritalStatus-${index}"
                                   value="${getValue(worker, 'maritalStatus', 'MaritalStatus')}" />
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nivel Educativo</label>
                            <input type="text" class="form-input" id="workerEducationalLevel-${index}"
                                   value="${getValue(worker, 'educationalLevel', 'EducationalLevel')}" />
                        </div>
                    </div>
                </div>
            </div>`;

        // Solo mostrar sección de datos médicos si hay campos con datos
        if (fieldsWithData.length > 0) {
            html += `
            <!-- Datos Específicos del Examen -->
            <div class="form-card" style="margin-bottom: 20px;">
                <div class="form-header">📊 Datos del Examen (${fieldsWithData.length} campos)</div>
                <div class="form-body">`;

            // Separar campos normales de textareas
            const normalFields = fieldsWithData.filter(f => !f.textarea);
            const textareaFields = fieldsWithData.filter(f => f.textarea);

            // Campos normales en grid
            if (normalFields.length > 0) {
                html += '<div class="form-grid">';
                normalFields.forEach(field => {
                    const value = getValue(dataExam, field.keys[0], field.keys[1]);
                    html += `
                        <div class="form-group">
                            <label class="form-label">${field.label}</label>
                            <input type="text" class="form-input" id="data${field.id}-${index}"
                                   value="${value}" placeholder="${field.placeholder}" />
                        </div>`;
                });
                html += '</div>';
            }

            // Textareas a ancho completo
            if (textareaFields.length > 0) {
                html += '<div class="form-grid" style="grid-template-columns: 1fr; margin-top: 15px;">';
                textareaFields.forEach(field => {
                    const value = getValue(dataExam, field.keys[0], field.keys[1]);
                    html += `
                        <div class="form-group">
                            <label class="form-label">${field.label}</label>
                            <textarea class="form-input" id="data${field.id}-${index}"
                                      placeholder="${field.placeholder}">${value}</textarea>
                        </div>`;
                });
                html += '</div>';
            }

            html += `
                </div>
            </div>`;
        } else {
            html += `
            <div class="form-card" style="margin-bottom: 20px;">
                <div class="form-header">📊 Datos del Examen</div>
                <div class="form-body">
                    <div style="text-align: center; color: #999; padding: 20px;">
                        No hay datos médicos registrados para este examen
                    </div>
                </div>
            </div>`;
        }

        return html;
    }

    function switchExam(index) {
        console.log('Cambiando a examen', index + 1);

        // Actualizar pestañas
        document.querySelectorAll('.exam-tab').forEach((tab, i) => {
            tab.classList.toggle('active', i === index);
        });

        // Actualizar contenido
        document.querySelectorAll('.exam-content').forEach((content, i) => {
            content.classList.toggle('active', i === index);
            console.log(`Formulario ${i + 1}: ${content.classList.contains('active') ? 'visible' : 'oculto'}`);
        });
    }

    async function saveChanges() {
        console.log('Total de exámenes a actualizar:', clinicalHistoryData.exams.length);

        const exams = clinicalHistoryData.exams.map((exam, index) => {
            // Función auxiliar para obtener valor del campo
            const getFieldValue = (fieldId) => {
                const element = document.getElementById(`${fieldId}-${index}`);
                return element ? element.value : null;
            };

            // Construir dataExam dinámicamente solo con campos que existen
            const dataExamData = {
                id: (exam.dataExam || {}).id
            };

            // Lista de todos los campos posibles de DataExam
            const dataExamFieldIds = [
                'dataYear', 'dataWorkAccident', 'dataOccupationalDiseases', 'dataManualActivities',
                'dataPhysicalActivity', 'dataSmokingHabits', 'dataAlcoholHabits', 'dataBloodPressure',
                'dataHeartRate', 'dataRespiratoryRate', 'dataDominantLaterality', 'dataAbdominalPerimeter',
                'dataWeight', 'dataSize', 'dataIMC', 'dataRightEar', 'dataLeftEar', 'dataDiagnostics',
                'dataOccupationalConcept', 'dataExamCode'
            ];

            // Mapeo de IDs de campos a nombres de propiedades del DTO
            const fieldMapping = {
                'dataYear': 'Year',
                'dataWorkAccident': 'WorkAccident',
                'dataOccupationalDiseases': 'OccupationalDiseases',
                'dataManualActivities': 'ManualActivities',
                'dataPhysicalActivity': 'PhysicalActivity',
                'dataSmokingHabits': 'SmokingHabits',
                'dataAlcoholHabits': 'AlcoholHabits',
                'dataBloodPressure': 'BloodPressure',
                'dataHeartRate': 'HeartRate',
                'dataRespiratoryRate': 'RespiratoryRate',
                'dataDominantLaterality': 'DominantLaterality',
                'dataAbdominalPerimeter': 'AbdominalPerimeter',
                'dataWeight': 'Weight',
                'dataSize': 'Size',
                'dataIMC': 'IMC',
                'dataRightEar': 'RightEar',
                'dataLeftEar': 'LeftEar',
                'dataDiagnostics': 'Diagnostics',
                'dataOccupationalConcept': 'OccupationalConcept',
                'dataExamCode': 'ExamCode'
            };

            // Solo agregar campos que existen en el DOM (fueron renderizados)
            dataExamFieldIds.forEach(fieldId => {
                const value = getFieldValue(fieldId);
                if (value !== null) {
                    const propertyName = fieldMapping[fieldId];
                    dataExamData[propertyName] = value || null;
                }
            });

            const examData = {
                id: exam.id,
                examName: getFieldValue('examName') || null,
                examDate: getFieldValue('examDate') || null,
                worker: {
                    id: (exam.worker || {}).id,
                    CC: getFieldValue('workerCC') || null,
                    Gender: getFieldValue('workerGender') || null,
                    Age: getFieldValue('workerAge') || null,
                    MaritalStatus: getFieldValue('workerMaritalStatus') || null,
                    EducationalLevel: getFieldValue('workerEducationalLevel') || null
                },
                dataExam: dataExamData
            };

            console.log(`Examen ${index + 1}:`, examData);
            return examData;
        });

        const dto = {
            id: clinicalHistoryData.id,
            exams: exams
        };

        console.log('DTO completo a enviar:', JSON.stringify(dto, null, 2));

        try {
            const response = await fetch(`${API_BASE_URL}/pdf/HC/update/${clinicalHistoryData.id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dto)
            });

            const responseData = await response.json();
            console.log('Respuesta del servidor:', responseData);

            if (!response.ok || responseData.code !== "200") {
                throw new Error(responseData.message || 'Error al actualizar');
            }

            showAlert('✅ Actualizado correctamente', 'success');
            setTimeout(() => window.location.href = 'PdfExtractedView.html', 2000);

        } catch (error) {
            console.error('Error completo:', error);
            showAlert('❌ Error: ' + error.message, 'error');
        }
    }

    function cancelEdit() {
        if (confirm('¿Cancelar cambios?')) window.location.href = 'PdfExtractedView.html';
    }

    function showAlert(message, type) {
        const alertDiv = document.getElementById('alertDiv');
        alertDiv.className = `alert alert-${type}`;
        alertDiv.textContent = message;
        alertDiv.style.display = 'block';
        setTimeout(() => alertDiv.style.display = 'none', 5000);
    }
</script>
</body>
</html>
